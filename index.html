<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ọya · Begripstrainer Elektriciteit</title>
<style>
/* Design system Elektriciteit (applet-afspraken § 5.7a): zeegroen = vragen/knoppen, aubergine = uitleg,
   amber = leerlingdenkbeeld, leigrijs = neutraal. Ladingen: + blauw, − rood (§ 3.1). Geen rood/groen voor goed/fout. */
:root {
  --zee:#1F6F6B; --zeed:#134A47; --zeet:#E8F3F2; --zeet2:#F0F7F6;
  --aub:#5B2A6E; --aubd:#3E1C4B; --aubt:#F5EEF8;
  --amber:#B45309; --amberd:#92400E; --ambert:#FFFBEB;
  --lei:#4A5568; --tekst:#2d3748; --grijs:#5F6B7A; --lijn:#e2e8f0; --lijn2:#cbd5e0;
  --bg:#f7f9fa; --kaart:#ffffff; --plus:#2B6CB0; --min:#C53030;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--tekst); font-family: "Segoe UI", Inter, system-ui, -apple-system, sans-serif;
  font-size: 16px; line-height: 1.5; -webkit-text-size-adjust: 100%; }
button { font: inherit; color: inherit; }
button:focus-visible { outline: 3px solid var(--zee); outline-offset: 2px; }
.wrap { max-width: 580px; margin: 0 auto; padding: 16px 16px 40px; display: flex; flex-direction: column; gap: 16px; }
h1, h2, h3 { margin: 0; line-height: 1.2; }
h1 { font-size: 1.7rem; font-weight: 800; color: var(--zeed); letter-spacing: -0.01em; }
h2 { font-size: 1.2rem; color: var(--zeed); }
.muted { color: var(--grijs); } .small { font-size: .85rem; }
.top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.sub { display: flex; align-items: center; gap: 6px; }
.info { border: 1px solid var(--lijn2); background: var(--kaart); border-radius: 999px; width: 24px; height: 24px; padding: 0;
  font-size: .8rem; font-weight: 700; color: var(--zeed); cursor: pointer; line-height: 22px; }
.infotekst { background: var(--kaart); border: 1px solid var(--lijn); border-left: 4px solid var(--lei); border-radius: 8px; padding: 10px 14px; font-size: .9rem; }
.doel { background: var(--kaart); border: 1px solid var(--lijn); border-radius: 12px; padding: 8px 12px; text-align: right; min-width: 128px; }
.doel .pips { display: flex; gap: 5px; justify-content: flex-end; margin: 2px 0; }
.doel .pip { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--zee); }
.doel .pip.vol { background: var(--zee); }
.doel .pips.veel { gap: 3px; }
.doel .pips.veel .pip { width: 11px; height: 11px; }
.instkop { font-weight: 600; margin: 2px 0 6px; }
.btn { border: 0; border-radius: 12px; padding: 13px 18px; font-weight: 600; cursor: pointer; text-align: center; }
.btn-primair { background: var(--zee); color: #fff; font-size: 1.05rem; box-shadow: 0 3px 0 var(--zeed); }
.btn-primair:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--zeed); }
.btn-stil { background: var(--kaart); border: 1px solid var(--lijn2); color: var(--zeed); }
.rij { display: flex; gap: 10px; flex-wrap: wrap; } .rij > * { flex: 1 1 0; }
/* Weken als haltes */
.lijnweken { list-style: none; margin: 0; padding: 0; position: relative; }
.lijnweken::before { content: ""; position: absolute; left: 31px; top: 30px; bottom: 30px; width: 4px; background: var(--lijn2); border-radius: 2px; }
.lijnweken li { position: relative; margin: 0 0 10px; }
.lijnweken.tm::before { background: var(--zee); }
/* t/m-stand: "t/m" klein in de halte zelf, zodat de rij niet hoger wordt */
.ring span.tm { display: flex; flex-direction: column; line-height: 1; gap: 1px; }
.ring span.tm small { font-size: .6rem; font-weight: 700; letter-spacing: .02em; }
.bereik { display: grid; gap: 6px; }
.bereik .seg button { min-height: 44px; }
@media (max-width: 520px) { .bereiktip { min-height: 3em; } } /* smal scherm: tip altijd twee regels hoog, zodat de lijst niet verspringt */
.halte { width: 100%; display: flex; align-items: center; gap: 14px; background: var(--kaart); border: 1px solid var(--lijn);
  border-radius: 14px; padding: 10px 14px 10px 6px; cursor: pointer; text-align: left; }
.halte:disabled { cursor: default; background: var(--bg); }
.ring { flex: 0 0 52px; width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; position: relative; z-index: 1; }
.ring span { width: 40px; height: 40px; border-radius: 50%; background: var(--kaart); display: grid; place-items: center;
  font-weight: 800; font-size: 1.1rem; color: var(--zeed); }
.halte:disabled .ring span { color: var(--grijs); background: var(--bg); }
.hnaam { font-weight: 700; color: var(--tekst); } .hsub { font-size: .82rem; color: var(--grijs); }
.hrechts { margin-left: auto; text-align: right; font-size: .78rem; color: var(--grijs); min-width: 78px; }
.hrechts b { display: block; font-size: 1.05rem; color: var(--tekst); }
/* Sessie */
.kop { display: flex; align-items: center; gap: 12px; }
.x { border: 0; background: none; font-size: 1.6rem; line-height: 1; cursor: pointer; color: var(--grijs); padding: 4px 8px; }
.balk { flex: 1; height: 12px; background: var(--lijn); border-radius: 999px; overflow: hidden; }
.balk div { height: 100%; background: var(--zee); border-radius: 999px; transition: width .3s; }
.vkaart { background: var(--kaart); border: 1px solid var(--lijn); border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--lijn2); border-radius: 999px; padding: 2px 10px; font-size: .78rem; color: var(--grijs); background: var(--kaart); }
.vraag { font-size: 1.12rem; font-weight: 600; }
.fig { display: flex; justify-content: center; } .fig svg { max-width: 100%; height: auto; }
.opties { display: flex; flex-direction: column; gap: 10px; }
.opt { text-align: left; border: 2px solid var(--lijn2); background: var(--kaart); border-radius: 12px; padding: 12px 14px; cursor: pointer;
  box-shadow: 0 2px 0 var(--lijn2); display: flex; gap: 10px; align-items: flex-start; }
.opt:hover:not(:disabled) { border-color: var(--zee); }
.opt .lt { font-weight: 700; color: var(--grijs); min-width: 1.2em; }
.opt.gekozen { border-color: var(--zee); background: var(--zeet2); }
.opt.goed { border-color: var(--zee); background: var(--zeet); }
.opt.goed::after { content: "✓ goed"; margin-left: auto; font-weight: 700; font-size: .85rem; color: var(--zeed); white-space: nowrap; }
.opt.fout { border-color: var(--lei); background: #edf2f7; }
.opt.fout::after { content: "✗ jouw keuze"; margin-left: auto; font-weight: 700; font-size: .85rem; color: var(--lei); white-space: nowrap; }
.opt:disabled { cursor: default; }
.trap2 { border-top: 1px dashed var(--lijn2); padding-top: 12px; display: flex; flex-direction: column; gap: 10px; }
.trap2 .lbl { font-weight: 700; color: var(--zeed); }
.koppel { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.kol { display: flex; flex-direction: column; gap: 8px; }
.kitem { border: 2px solid var(--lijn2); background: var(--kaart); border-radius: 10px; padding: 10px; cursor: pointer; text-align: left; font-size: .95rem; }
.kitem.sel { border-color: var(--zee); background: var(--zeet2); }
.kitem.klaar { border-color: var(--zee); background: var(--zeet); color: var(--zeed); }
.kitem.mis { animation: schud .4s; border-color: var(--lei); }
@keyframes schud { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
.terug { background: var(--kaart); border: 1px solid var(--lijn); border-left: 4px solid var(--aub); border-radius: 12px; padding: 14px 16px;
  display: flex; flex-direction: column; gap: 10px; }
.terug h3 { color: var(--aubd); font-size: 1.1rem; }
.noot { background: var(--ambert); border-left: 4px solid var(--amber); border-radius: 8px; padding: 8px 12px; font-size: .92rem; }
.noot b { color: var(--amberd); }
.boek { font-size: .88rem; color: var(--grijs); }
.elektra { background: var(--zeet2); border: 1px dashed var(--zee); border-radius: 8px; padding: 8px 12px; font-size: .9rem; }
.elektra button { margin-top: 6px; border: 1px solid var(--zee); background: var(--kaart); color: var(--zeed); border-radius: 8px; padding: 4px 10px; cursor: pointer; font-size: .85rem; }
.kaart { background: var(--kaart); border: 1px solid var(--lijn); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.groot { font-size: 2.8rem; font-weight: 800; color: var(--zeed); line-height: 1; }
.seg { display: flex; border: 1px solid var(--lijn2); border-radius: 12px; overflow: hidden; }
.seg button { flex: 1; border: 0; background: var(--kaart); padding: 10px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--zee); color: #fff; font-weight: 600; }
.voet { font-size: .8rem; color: var(--grijs); text-align: center; }
.legenda { display: flex; gap: 12px; flex-wrap: wrap; font-size: .78rem; color: var(--grijs); }
/* Klasmodus (beamer) */
body.klas .wrap { max-width: 1100px; font-size: 22px; }
body.klas .vraag { font-size: 1.5rem; }
body.klas .opt { padding: 14px 18px; }
.opt.kk { border-color: var(--aub); background: var(--aubt); }
.opt.kk::after { content: "gekozen"; margin-left: auto; font-weight: 700; font-size: .85rem; color: var(--aubd); white-space: nowrap; }
.opt.kk.goed { border-color: var(--zee); background: var(--zeet); }
.opt.kk.goed::after { content: "✓ goed · gekozen"; color: var(--zeed); }
.opt.kk.toon:not(.goed) { border-color: var(--lei); background: #edf2f7; }
.opt.kk.toon:not(.goed)::after { content: "✗ gekozen"; color: var(--lei); }
.klasbalk { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.klasbalk .btn { font-size: 1rem; }
.herstem { background: var(--zeet); border: 2px solid var(--zee); border-radius: 12px; padding: 10px 16px; font-weight: 700; color: var(--zeed); text-align: center; }
.kolommen { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
@media (max-width: 760px) { .kolommen { grid-template-columns: 1fr; } }
</style>
</head>

const PIJL = (x1, y1, x2, y2, kl) => { const a = Math.atan2(y2-y1, x2-x1), h = 9; return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${kl}" stroke-width="2.5"/><path d="M${x2},${y2} L${(x2-h*Math.cos(a-0.4)).toFixed(1)},${(y2-h*Math.sin(a-0.4)).toFixed(1)} L${(x2-h*Math.cos(a+0.4)).toFixed(1)},${(y2-h*Math.sin(a+0.4)).toFixed(1)}Z" fill="${kl}"/>`; };

  { id: "w1-12", w: 1, s: "reken", t: "mc", par: "18.5",
    q: "Twee puntladingen oefenen een kracht F op elkaar uit. Je maakt de afstand twee keer zo groot. Hoe groot wordt de kracht?",
    o: ["F/4", "F/2", "2F", "4F"],
    why: "De kracht is omgekeerd evenredig met r². Twee keer zo ver weg: 2² = 4 keer zo klein, dus F/4.",
    mis: "Lineair denken: twee keer zo ver, half zo sterk (het kwadraat vergeten)." },
  { id: "w1-13", w: 1, s: "reken", t: "mc", par: "18.5",
    q: "Twee puntladingen oefenen een kracht F op elkaar uit. Je maakt beide ladingen twee keer zo groot én de afstand twee keer zo groot. Hoe groot wordt de kracht?",
    o: ["F", "2F", "F/2", "4F"],
    why: "De teller wordt 2 · 2 = 4 keer zo groot, de noemer r² ook 4 keer zo groot. Samen: de kracht blijft F." },
  { id: "w1-14", w: 1, s: "reken", t: "mc", par: "18.1",
    q: "Een voorwerp heeft een lading van −1,6 · 10⁻¹⁸ C. Hoeveel elektronen heeft het te veel?",
    o: ["10", "100", "1", "16"],
    why: "Aantal = lading / e = 1,6 · 10⁻¹⁸ / 1,6 · 10⁻¹⁹ = 10." },
  { id: "w1-15", w: 1, s: "reken", t: "mc", par: "18.7",
    q: "In een tekening vertrekken 8 veldlijnen uit een lading van +2 µC. Hoeveel veldlijnen horen er bij een lading van −4 µC in dezelfde tekening?",
    o: ["16, die eindigen op de lading", "16, die vertrekken uit de lading", "8, die eindigen op de lading", "4, die eindigen op de lading"],
    why: "Het aantal veldlijnen is evenredig met de grootte van de lading: twee keer zoveel lading, twee keer zoveel lijnen. Veldlijnen beginnen bij positieve en eindigen bij negatieve lading." },
  { id: "w1-16", w: 1, s: "begrip", t: "mc", par: "18.7",
    q: "Waarom kunnen twee elektrische veldlijnen elkaar nooit snijden?",
    o: ["Op elk punt heeft het elektrische veld maar één richting.", "Veldlijnen stoten elkaar af, net als gelijke ladingen.", "Op een snijpunt zou het veld oneindig groot worden.", "Dat kan wel, bijvoorbeeld tussen twee positieve ladingen."],
    why: "Een veldlijn geeft in elk punt de richting van het veld. Bij een snijpunt zou het veld daar twee richtingen hebben, en dat kan niet: de bijdragen van alle ladingen tellen op tot één veld met één richting." },
  { id: "w1-17", w: 1, s: "begrip", t: "mc", par: "18.7",
    q: "Waar is het elektrische veld het sterkst in een veldlijnenpatroon?",
    o: ["Waar de veldlijnen het dichtst bij elkaar liggen.", "Waar de veldlijnen het verst uit elkaar liggen.", "Alleen óp de veldlijnen; ertussen is er geen veld.", "Overal even sterk; de lijnen geven alleen de richting."],
    why: "De dichtheid van de lijnen is een maat voor de veldsterkte. Het veld bestaat ook tussen de getekende lijnen: je tekent er maar een paar.",
    mis: "Het veld bestaat alleen op de getekende lijnen." },
  { id: "w1-18", w: 1, s: "begrip", t: "twee", par: "18.7",
    q: "Een klein, positief geladen deeltje ligt stil op een gebogen veldlijn tussen een positieve en een negatieve lading. Je laat het los. Volgt het deeltje precies die veldlijn?",
    o: ["Nee", "Ja"],
    r: ["De kracht wijst langs de veldlijn, maar het deeltje krijgt snelheid en neemt die mee de bocht in: de baan wijkt naar buiten af.",
        "Een veldlijn is per definitie de baan die een lading volgt.",
        "Het deeltje beweegt loodrecht op de veldlijn."],
    why: "Een veldlijn geeft de richting van de kracht, niet van de snelheid. Bij een rechte veldlijn valt de baan samen met de lijn, maar bij een gebogen lijn 'schiet' het deeltje door zijn snelheid uit de bocht.",
    mis: "Veldlijnen zijn de banen van ladingen.",
    elektra: "Waarom volgt een geladen deeltje een gebogen veldlijn niet precies?" },
  { id: "w1-19", w: 1, s: "begrip", t: "mc", par: "18.3",
    q: "Waarom geleidt een metaal lading goed en plastic niet?",
    o: ["In een metaal kunnen sommige elektronen vrij bewegen; in plastic zitten ze vast aan hun atomen.", "Een metaal bevat meer elektronen dan plastic.", "In plastic zitten geen elektronen.", "In een metaal bewegen de protonen mee."],
    why: "Het verschil zit niet in het aantal elektronen, maar in hoe vast ze zitten. In een metaal zijn de buitenste elektronen vrij; in een isolator zitten alle elektronen aan hun atoom gebonden. Zie ook de applet over geleiding (week 2)." },
  { id: "w1-21", w: 1, s: "begrip", t: "mc", par: "18.2 en 18.4", fig: FIG_BOLLETJES,
    q: "Bolletje A is positief. A en B stoten elkaar af; B en C trekken elkaar aan (zie de tekening). Wat weet je over de lading van C?",
    o: ["C is negatief of neutraal.", "C is negatief.", "C is positief.", "C is neutraal."],
    why: "Afstoten kan alleen bij gelijke lading, dus B is positief. Een positief bolletje trekt een negatief bolletje aan, maar ook een neutraal bolletje: in C verschuift de lading een beetje (polarisatie). Uit aantrekking alleen kun je dus niet concluderen dat C negatief is.",
    mis: "Aantrekking betekent altijd tegengestelde lading. Alleen afstoting bewijst dat een voorwerp geladen is.",
    elektra: "Waarom bewijst afstoting wel dat een voorwerp geladen is en aantrekking niet?" },
  { id: "w1-22", w: 1, s: "begrip", t: "mc", par: "18.7", fig: FIG_VELD,
    q: "Bij welke twee ladingen hoort dit veldlijnenpatroon?",
    o: ["Twee even grote positieve ladingen", "Een positieve en een even grote negatieve lading", "Twee even grote negatieve ladingen", "Een grote en een kleine positieve lading"],
    why: "De pijlen wijzen van beide ladingen af: beide zijn positief. Er lopen geen lijnen van de ene naar de andere lading, en het patroon is symmetrisch met evenveel lijnen per lading: ze zijn even groot. Bij een + en een − zouden de lijnen van de ene naar de andere lading lopen." },
  { id: "w1-23", w: 1, s: "begrip", t: "mc", par: "18.5", fig: FIG_DRIE,
    q: "Drie ladingen liggen op één lijn, op gelijke afstanden (zie de tekening). Welke richting heeft de netto elektrische kracht op de middelste lading?",
    o: ["Naar links", "Naar rechts", "De netto kracht is nul.", "Loodrecht op de lijn"],
    why: "De −q links trekt de middelste +q naar links. De +q rechts stoot de middelste +q af, ook naar links. Beide krachten zijn even groot en wijzen dezelfde kant op: de netto kracht wijst naar links.",
    mis: "De krachten heffen elkaar op omdat de afstanden gelijk zijn (zonder naar de tekens te kijken)." },
  { id: "w1-20", w: 1, s: "kennis", t: "mc", par: null,
    q: "Het woord elektriciteit komt van het Griekse ēlektron. Wat betekent dat?",
    o: ["Barnsteen", "Bliksem", "Vonk", "Wrijven"],
    why: "Ēlektron is barnsteen. Al in de oudheid zag men dat gewreven barnsteen lichte dingen aantrekt." },
  // ---------- Week 2: Spanning en stroomsterkte ----------
  { id: "w2-01", w: 2, s: "kennis", t: "koppel", par: "20.1–20.4",
    q: "Koppel elke grootheid aan haar eenheid.",
    pairs: [["spanning U", "volt (V)"], ["stroomsterkte I", "ampère (A)"], ["weerstand R", "ohm (Ω)"], ["vermogen P", "watt (W)"]],
    why: "Let op: het boek gebruikt V voor spanning. Wij schrijven U, zodat het symbool niet hetzelfde is als de eenheid volt." },
  { id: "w2-02", w: 2, s: "kennis", t: "koppel", par: "20.1–20.4",
    q: "Koppel elke eenheid aan wat ze betekent.",
    pairs: [["1 V", "1 J/C"], ["1 A", "1 C/s"], ["1 W", "1 J/s"], ["1 Ω", "1 V/A"]],
    why: "Spanning is energie per lading (J/C), stroomsterkte is lading per seconde (C/s), vermogen is energie per seconde (J/s) en weerstand is spanning per stroom (V/A)." },
  { id: "w2-03", w: 2, s: "kennis", t: "mc", par: "20.1",
    q: "Welke Engelse term gebruikt het boek voor de bronspanning van een batterij?",
    o: ["emf (electromotive force)", "voltage drop", "current", "resistivity"],
    why: "Emf (elektromotorische kracht, emk) is de bronspanning: de energie die de bron per coulomb lading levert. Het is geen kracht, ondanks de naam. Het boek gebruikt het symbool V; wij schrijven U." },
  { id: "w2-04", w: 2, s: "begrip", t: "twee", par: "20.1", fig: FIG_AMPERE,
    q: "Ampèremeter A₁ vóór het lampje meet 0,30 A. Wat meet ampèremeter A₂ achter het lampje?",
    o: ["0,30 A", "Minder dan 0,30 A", "Meer dan 0,30 A"],
    r: ["Lading wordt niet verbruikt: alle lading die het lampje in gaat, komt er ook weer uit.",
        "Het lampje verbruikt een deel van de stroom om licht te geven.",
        "Achter het lampje is de spanning lager, dus is ook de stroom kleiner."],
    why: "Stroom is lading per seconde. Er verdwijnt geen lading in het lampje, dus overal in deze kring is de stroom even groot. Wat het lampje 'verbruikt', is energie: elke coulomb levert daar energie af (de spanning over het lampje).",
    mis: "Stroom wordt verbruikt in een lampje. Laat leerlingen voorspellen wat een ampèremeter vóór en achter het lampje aanwijst, en meet het daarna.",
    elektra: "Waarom is de stroom vóór en achter een lampje even groot, terwijl het lampje wel energie gebruikt?" },
  { id: "w2-05", w: 2, s: "begrip", t: "mc", par: "20.1", fig: FIG_OPEN,
    q: "De schakelaar is open. Wat wijst de voltmeter over de open schakelaar aan?",
    o: ["9 V", "0 V", "4,5 V"],
    why: "Er loopt geen stroom, dus staat er over het lampje geen spanning (U = I·R = 0). De volledige bronspanning van 9 V staat daarom over de opening in de schakelaar.",
    mis: "Spanning bestaat pas als er een stroom loopt. Een batterij zonder stroom heeft wel degelijk spanning.",
    elektra: "Waarom staat er over een open schakelaar de volle bronspanning?" },
  { id: "w2-06", w: 2, s: "begrip", t: "mc", par: "20.1",
    q: "Wat is het verschil tussen spanning en stroomsterkte?",
    o: ["Spanning is energie per lading tussen twee punten; stroomsterkte is lading per seconde door één punt.",
        "Spanning is de hoeveelheid stroom die een batterij kan leveren.",
        "Stroom is de snelheid waarmee de spanning door de draad gaat.",
        "Het is hetzelfde, maar met een andere eenheid."],
    why: "Spanning staat óver iets (tussen twee punten), stroom gaat dóór iets (door één punt). Dat zie je ook aan het meten: een voltmeter zet je parallel, een ampèremeter in serie.",
    mis: "Stroom en spanning worden door elkaar gehaald. Laat leerlingen consequent zeggen: spanning óver, stroom dóór." },
  { id: "w2-07", w: 2, s: "begrip", t: "mc", par: "20.1",
    q: "Waar komen de elektronen vandaan die door een lampje stromen als je het op een batterij aansluit?",
    o: ["Ze zitten al in de draden en het lampje; de batterij zet ze in beweging.",
        "Uit de batterij, die een voorraad elektronen bevat.",
        "Ze ontstaan in de batterij door een chemische reactie.",
        "Uit de lucht rond de draden."],
    why: "Een metaal zit vol vrije elektronen. De batterij levert energie en zet die elektronen in de hele kring in beweging. Een batterij is dus een energiebron, geen opslag van lading: hij raakt 'leeg' als de chemische energie op is.",
    mis: "Een batterij is een voorraad elektronen (of 'stroom').",
    elektra: "Is een batterij een opslag van lading of van energie?" },
  { id: "w2-08", w: 2, s: "reken", t: "mc", par: "20.2",
    q: "Over een weerstand van 20 Ω staat een spanning van 6,0 V. Hoe groot is de stroom?",
    o: ["0,30 A", "120 A", "3,3 A", "0,030 A"],
    why: "I = U/R = 6,0/20 = 0,30 A. Wie U en R vermenigvuldigt, krijgt 120; wie R/U doet, krijgt 3,3." },
  { id: "w2-09", w: 2, s: "begrip", t: "mc", par: "20.2", fig: FIG_UI,
    q: "In het diagram staan de lijnen van weerstand A en weerstand B. Welke weerstand is het grootst?",
    o: ["B", "A", "Ze zijn even groot."],
    why: "R = U/I. Kies één spanning: bij B hoort dan een kleinere stroom dan bij A. Minder stroom bij dezelfde spanning betekent een grotere weerstand. Let op de assen: hier staat I verticaal, dus de steilste lijn hoort bij de kleinste weerstand.",
    mis: "Een steilere lijn betekent altijd een grotere weerstand (zonder naar de assen te kijken)." },
  { id: "w2-10", w: 2, s: "begrip", t: "mc", par: "20.3",
    q: "Hoe ziet het (U,I)-diagram van een gloeilamp eruit, met U horizontaal en I verticaal?",
    o: ["Een kromme die steeds minder steil oploopt", "Een rechte lijn door de oorsprong", "Een kromme die steeds steiler oploopt", "Een horizontale lijn"],
    why: "Bij een grotere spanning wordt de gloeidraad heter. De weerstand van wolfraam stijgt dan sterk, zodat de stroom steeds minder toeneemt. De lijn buigt dus af naar de U-as.",
    mis: "De weerstand van een lampje is constant." },
  { id: "w2-11", w: 2, s: "reken", t: "mc", par: "20.3",
    q: "Een draad heeft een weerstand R. Een tweede draad van hetzelfde materiaal is twee keer zo lang en heeft een twee keer zo grote diameter. Hoe groot is zijn weerstand?",
    o: ["R/2", "R", "2R", "4R"],
    why: "R = ρ·L/A. De lengte wordt 2 keer zo groot. Een 2 keer zo grote diameter maakt de doorsnede A 4 keer zo groot. Samen: 2/4, dus R/2.",
    mis: "Diameter en doorsnede verwarren: twee keer zo dik lijkt dan twee keer zo veel ruimte voor stroom." },
  { id: "w2-12", w: 2, s: "kennis", t: "mc", par: "20.3",
    q: "Voor de soortelijke weerstand geldt ρ = ρ₀·[1 + α·(T − T₀)]. Van een materiaal is α kleiner dan nul. Wat voor weerstand kun je ervan maken?",
    o: ["Een NTC", "Een PTC", "Een ohmse weerstand"],
    why: "Bij α < 0 wordt ρ kleiner als de temperatuur stijgt: een negatieve temperatuurcoëfficiënt, dus een NTC. Bij α > 0 (metalen) neemt de weerstand toe: PTC. Een ohmse weerstand houdt bij verschillende temperaturen (vrijwel) dezelfde weerstand: α ≈ 0." },
  { id: "w2-13", w: 2, s: "kennis", t: "koppel", par: "20.3",
    q: "Koppel de temperatuurcoëfficiënt α aan het soort weerstand.",
    pairs: [["α > 0", "PTC, bijvoorbeeld een metaaldraad"], ["α < 0", "NTC, een halfgeleider"], ["α ≈ 0", "ohmse weerstand, bijvoorbeeld constantaan"]],
    why: "PTC en NTC staan voor positieve en negatieve temperatuurcoëfficiënt. Constantaan is een legering die juist gekozen wordt omdat de weerstand nauwelijks van de temperatuur afhangt." },
  { id: "w2-14", w: 2, s: "kennis", t: "mc", par: "20.3",
    q: "Een NTC-weerstand wordt warmer. Wat gebeurt er met zijn weerstand?",
    o: ["Die wordt kleiner.", "Die wordt groter.", "Die blijft gelijk."],
    why: "NTC staat voor negatieve temperatuurcoëfficiënt: de weerstand neemt af als de temperatuur stijgt. Een NTC is een halfgeleider; bij een hogere temperatuur komen er meer vrije ladingsdragers. Je ziet dit in de applet over geleiding." },
  { id: "w2-15", w: 2, s: "begrip", t: "mc", par: "20.3",
    q: "Waarom neemt de weerstand van een metaaldraad toe als hij warmer wordt?",
    o: ["De ionen in het rooster trillen sterker, zodat de vrije elektronen vaker botsen.",
        "Er komen minder vrije elektronen.",
        "De draad zet uit en wordt langer; dat is de belangrijkste oorzaak.",
        "Warme elektronen bewegen langzamer."],
    why: "In een metaal verandert het aantal vrije elektronen nauwelijks. Bij een hogere temperatuur trillen de ionen harder en botsen de elektronen vaker, waardoor ze minder makkelijk opschuiven. De uitzetting van de draad speelt maar een heel kleine rol." },
  { id: "w2-16", w: 2, s: "reken", t: "mc", par: "20.4",
    q: "Door een lampje op 12 V loopt een stroom van 0,50 A. Hoe groot is het vermogen?",
    o: ["6,0 W", "24 W", "0,042 W", "12,5 W"],
    why: "P = U·I = 12 · 0,50 = 6,0 W." },
  { id: "w2-17", w: 2, s: "reken", t: "mc", par: "20.4",
    q: "Een waterkoker van 2000 W staat 3 minuten aan. Hoeveel energie gebruikt hij, in kWh?",
    o: ["0,1 kWh", "6 kWh", "0,6 kWh", "100 kWh"],
    why: "E = P·t = 2 kW · 0,05 h = 0,1 kWh. Drie minuten is 3/60 = 0,05 uur. Wie met 3 (minuten) rekent, komt op 6." },
  { id: "w2-18", w: 2, s: "begrip", t: "twee", par: "20.4",
    q: "Je sluit een weerstand van 10 Ω en een weerstand van 20 Ω elk afzonderlijk aan op dezelfde batterij. In welke weerstand wordt het grootste vermogen omgezet?",
    o: ["In de weerstand van 10 Ω", "In de weerstand van 20 Ω", "In beide even veel"],
    r: ["Bij dezelfde spanning geldt P = U²/R: een kleinere weerstand laat meer stroom door en zet meer vermogen om.",
        "Volgens P = I²R hoort bij een grotere weerstand een groter vermogen.",
        "Het vermogen hangt alleen af van de spanning van de batterij."],
    why: "De spanning is in beide gevallen gelijk. Dan is P = U²/R het handigst: halve weerstand, dubbel vermogen. P = I²R geldt ook, maar de stroom is niet gelijk: door 10 Ω loopt twee keer zoveel stroom.",
    mis: "Een grotere weerstand betekent altijd meer (of altijd minder) vermogen. Het hangt af van wat er gelijk blijft: de stroom (serie) of de spanning.",
    elektra: "Wanneer gebruik je P = I²R en wanneer P = U²/R om vermogens te vergelijken?" },
  { id: "w2-19", w: 2, s: "reken", t: "mc", par: "20.5", fig: FIG_SINUS,
    q: "De netspanning heeft een piekwaarde van 325 V (zie de grafiek). Hoe groot is de effectieve waarde?",
    o: ["230 V", "325 V", "163 V", "0 V"],
    why: "Ueff = Umax/√2 = 325/1,41 ≈ 230 V. De helft (163 V) is fout: de factor is √2, niet 2. Het gemiddelde over een hele periode is 0 V, maar dat is niet de effectieve waarde.",
    mis: "De effectieve waarde is het gemiddelde van de wisselspanning." },
  { id: "w2-20", w: 2, s: "begrip", t: "mc", par: "20.5",
    q: "Wat betekent het dat de netspanning 'effectief 230 V' is?",
    o: ["Een weerstand zet gemiddeld hetzelfde vermogen om als bij een gelijkspanning van 230 V.",
        "Het gemiddelde van de spanning over een periode is 230 V.",
        "De spanning is meestal 230 V en piekt soms hoger.",
        "De maximale spanning is 230 V."],
    why: "De effectieve waarde is gedefinieerd via het vermogen: een kachel op 230 V wisselspanning wordt even warm als op 230 V gelijkspanning. De spanning zelf wisselt voortdurend tussen +325 V en −325 V." },
  { id: "w2-21", w: 2, s: "kennis", t: "mc", par: "20.5",
    q: "Wat is de frequentie van de netspanning in Nederland?",
    o: ["50 Hz", "60 Hz", "230 Hz", "1 Hz"],
    why: "In Nederland en de rest van Europa is dat 50 Hz, bij 230 V. Het boek is Amerikaans en rekent vaak met 120 V en 60 Hz." },
  // ---------- Week 3: Schakelingen ----------
  { id: "w3-01", w: 3, s: "begrip", t: "mc", par: "20.6",
    q: "Hoe loopt de stroom in een kring met een batterij en een lampje?",
    o: ["Eén stroom rond: uit de ene pool, door het lampje en via de andere draad terug naar de andere pool.",
        "Uit beide polen naar het lampje, waar de twee stromen botsen.",
        "Alleen van de pluspool naar het lampje; de tweede draad is er voor de veiligheid.",
        "Door één draad heen en door dezelfde draad weer terug."],
    why: "In een gesloten kring loopt één kringstroom, overal even groot. Zonder tweede draad is de kring niet gesloten en brandt het lampje niet.",
    mis: "Het botsende-stroommodel (stroom uit beide polen) en het unipolaire model (één draad is genoeg). Laat leerlingen voorspellen of een lampje met één draad brandt.",
    elektra: "Waarom heb je twee draden nodig om een lampje te laten branden?" },
  { id: "w3-02", w: 3, s: "begrip", t: "mc", par: "20.6", fig: FIG_SERIE,
    q: "Lampjes A en B zijn gelijk en staan in serie. Welk lampje brandt het felst?",
    o: ["Ze branden even fel.", "A, want de stroom komt daar eerst langs.", "B, want daar komt de stroom het laatst aan."],
    why: "In een serieschakeling loopt door elk onderdeel dezelfde stroom. Gelijke lampjes met dezelfde stroom branden even fel. De volgorde maakt niet uit.",
    mis: "Sequentieel redeneren of het verzwakkingsmodel: de stroom raakt onderweg op." },
  { id: "w3-03", w: 3, s: "begrip", t: "twee", par: "20.6",
    q: "Een lampje brandt op een batterij. Je zet een tweede, gelijk lampje in serie erbij. Wat gebeurt er met de helderheid van het eerste lampje?",
    o: ["Het brandt zwakker.", "Het brandt even fel.", "Het brandt feller."],
    r: ["De totale weerstand wordt groter, dus de stroom uit de batterij wordt kleiner.",
        "De batterij levert een vaste stroom, die nu over twee lampjes verdeeld wordt.",
        "Elk lampje krijgt nog steeds de volle spanning van de batterij."],
    why: "De batterij levert (ongeveer) een vaste spanning, geen vaste stroom. Met twee lampjes in serie is de weerstand twee keer zo groot, dus de stroom half zo groot. Elk lampje krijgt de halve spanning en brandt zwakker.",
    mis: "Het delingsmodel: de batterij levert een vaste stroom die de lampjes 'delen'. Dat geeft hier toevallig het goede antwoord, maar om de verkeerde reden.",
    elektra: "Levert een batterij een vaste stroom of een vaste spanning?" },
  { id: "w3-04", w: 3, s: "begrip", t: "twee", par: "20.7", fig: FIG_PARALLEL,
    q: "Lampjes A en B zijn gelijk en staan parallel op een (ideale) batterij. De schakelaar bij B is open, dus alleen A brandt. Je sluit de schakelaar. Wat gebeurt er met lampje A?",
    o: ["A blijft even fel branden.", "A gaat zwakker branden.", "A gaat feller branden."],
    r: ["Over A staat nog steeds de volle bronspanning; de batterij levert gewoon meer stroom.",
        "De stroom uit de batterij wordt nu over twee lampjes verdeeld.",
        "De totale weerstand wordt kleiner, dus er gaat meer stroom door A."],
    why: "Elke parallelle tak staat direct op de batterij. Bij een ideale bron verandert de spanning over A niet, dus ook de stroom door A niet. De batterij levert nu twee keer zoveel stroom. (Een echte batterij heeft inwendige weerstand; dan wordt A een heel klein beetje zwakker.)",
    mis: "Meer lampjes parallel maakt elk lampje zwakker, omdat de batterij 'verdeelt'. Laat leerlingen ook de batterijstroom voorspellen.",
    elektra: "Waarom brandt een lampje even fel als je er een tweede lampje parallel bij zet?" },
  { id: "w3-05", w: 3, s: "reken", t: "mc", par: "20.7",
    q: "Twee gelijke lampjes staan parallel op een batterij. Door elk lampje loopt 0,20 A. Hoeveel stroom levert de batterij?",
    o: ["0,40 A", "0,20 A", "0,10 A", "0,80 A"],
    why: "In een knooppunt splitst de stroom: de stromen door de takken tellen op. 0,20 + 0,20 = 0,40 A." },
  { id: "w3-06", w: 3, s: "begrip", t: "mc", par: "20.8", fig: FIG_KORT,
    q: "Lampjes A en B branden in serie. Je zet een extra draad parallel aan lampje B (zie de tekening). Wat gebeurt er?",
    o: ["B gaat uit en A brandt feller.", "B gaat uit en A blijft even fel.", "Beide lampjes branden zwakker.", "B brandt nog een beetje en A brandt feller."],
    why: "De draad heeft (bijna) geen weerstand: B is kortgesloten. Over B staat dan (bijna) geen spanning, dus B gaat uit. De totale weerstand is nu alleen die van A, dus de stroom wordt groter en A brandt feller (op de volle bronspanning).",
    mis: "Bij een kortsluiting gaat er toch nog een beetje stroom door het lampje." },
  { id: "w3-07", w: 3, s: "begrip", t: "mc", par: "20.6",
    q: "Een batterij, een lampje en een weerstand staan in serie. Je verplaatst de weerstand van vóór het lampje naar achter het lampje. Wat gebeurt er met het lampje?",
    o: ["Niets; het brandt even fel.", "Het brandt feller.", "Het brandt zwakker."],
    why: "De stroom wordt bepaald door de totale weerstand van de kring, en die verandert niet. De kring reageert als geheel: 'vóór' of 'achter' maakt niet uit.",
    mis: "Sequentieel redeneren: een weerstand achter het lampje heeft geen invloed, want de stroom is het lampje al voorbij." },
  { id: "w3-08", w: 3, s: "reken", t: "mc", par: "20.6",
    q: "Weerstanden van 10 Ω en 30 Ω staan in serie. Hoe groot is de vervangingsweerstand?",
    o: ["40 Ω", "7,5 Ω", "20 Ω", "300 Ω"],
    why: "In serie tel je de weerstanden op: 10 + 30 = 40 Ω. 7,5 Ω zou de vervangingsweerstand bij parallel schakelen zijn." },
  { id: "w3-09", w: 3, s: "reken", t: "mc", par: "20.7",
    q: "Twee weerstanden van elk 20 Ω staan parallel. Hoe groot is de vervangingsweerstand?",
    o: ["10 Ω", "40 Ω", "20 Ω", "0,10 Ω"],
    why: "1/R = 1/20 + 1/20 = 2/20, dus R = 10 Ω. Twee gelijke weerstanden parallel geven de helft. Wie 1/R vergeet om te keren, komt op 0,10." },
  { id: "w3-10", w: 3, s: "begrip", t: "mc", par: "20.7",
    q: "Je zet een extra weerstand parallel aan een bestaande weerstand. Wat gebeurt er met de vervangingsweerstand?",
    o: ["Die wordt kleiner, zelfs kleiner dan de kleinste van de twee.", "Die wordt groter.", "Die blijft gelijk.", "Dat hangt af van welke weerstand het grootst is."],
    why: "Een extra parallelle tak is een extra weg voor de stroom. Bij dezelfde spanning loopt er dus meer stroom: de vervangingsweerstand wordt kleiner, altijd kleiner dan de kleinste losse weerstand." },
  { id: "w3-11", w: 3, s: "reken", t: "mc", par: "20.8", fig: FIG_NETWERK,
    q: "Hoe groot is de vervangingsweerstand tussen A en B?",
    o: ["20 Ω", "50 Ω", "30 Ω", "15 Ω"],
    why: "De twee weerstanden van 20 Ω parallel geven samen 10 Ω. Die staan in serie met 10 Ω: 10 + 10 = 20 Ω. Wie alles optelt, krijgt 50 Ω." },
  { id: "w3-12", w: 3, s: "reken", t: "mc", par: "20.10", fig: FIG_KNOOP,
    q: "In het knooppunt komt 3 A binnen en gaat 1 A weg (zie de tekening). Hoe groot is I₃, en welke richting heeft die stroom?",
    o: ["2 A, van het knooppunt af", "4 A, van het knooppunt af", "2 A, naar het knooppunt toe", "4 A, naar het knooppunt toe"],
    why: "Knooppuntregel: wat binnenkomt, gaat er ook weer uit (ladingsbehoud). Er komt 3 A binnen en 1 A gaat weg, dus moet er nog 2 A weggaan via I₃." },
  { id: "w3-13", w: 3, s: "begrip", t: "mc", par: "20.10",
    q: "Je lost met de regels van Kirchhoff een stroom op en vindt I₂ = −0,4 A. Wat betekent dat?",
    o: ["Er loopt 0,4 A, maar tegen de richting in die je vooraf koos.", "Je hebt een rekenfout gemaakt.", "Er loopt geen stroom.", "De stroom is te klein om te meten."],
    why: "Bij Kirchhoff kies je de richting van elke stroom vooraf willekeurig. Een negatieve uitkomst is geen fout: de stroom loopt dan de andere kant op. Reken daarna wel consequent verder met het minteken.",
    mis: "Je moet de stroomrichtingen vooraf 'goed' kiezen, anders klopt de berekening niet.",
    elektra: "Wat betekent een negatieve stroom als je de wetten van Kirchhoff toepast?" },
  { id: "w3-14", w: 3, s: "kennis", t: "koppel", par: "20.10–20.11",
    q: "Koppel elk begrip aan wat erbij hoort.",
    pairs: [["knooppuntregel", "volgt uit ladingsbehoud"], ["lusregel", "volgt uit energiebehoud"], ["ampèremeter", "in serie, heel kleine weerstand"], ["voltmeter", "parallel, heel grote weerstand"]],
    why: "Lading verdwijnt niet in een knooppunt, en een lading die een hele lus rondgaat, krijgt evenveel energie als ze afgeeft. Een meter mag de schakeling zo weinig mogelijk storen: daarom heeft een ampèremeter een heel kleine en een voltmeter een heel grote weerstand." },
  { id: "w3-15", w: 3, s: "kennis", t: "mc", par: "20.10",
    q: "Wat zegt de lusregel (maaswet) van Kirchhoff?",
    o: ["Rond een gesloten lus is de som van alle spanningsveranderingen nul.", "In een gesloten lus is de som van de stromen nul.", "Over elke weerstand in een lus staat dezelfde spanning.", "De stroom is in elke lus van een netwerk even groot."],
    why: "De bronspanningen in een lus zijn samen even groot als de spanningen over de weerstanden. Dat is energiebehoud: ga je rond en kom je terug op hetzelfde punt, dan heeft de lading weer dezelfde energie." },
  { id: "w3-16", w: 3, s: "begrip", t: "twee", par: "20.11",
    q: "Je zet per ongeluk een voltmeter in serie met een lampje op een batterij. Wat gebeurt er?",
    o: ["Het lampje gaat (vrijwel) uit.", "Het lampje brandt normaal.", "De voltmeter gaat stuk."],
    r: ["Een voltmeter heeft een heel grote weerstand, dus de stroom wordt vrijwel nul.",
        "Een voltmeter meet alleen spanning en heeft geen invloed op de stroom.",
        "Door een voltmeter loopt altijd een grote stroom."],
    why: "Door de grote weerstand van de voltmeter loopt er bijna geen stroom. Het lampje gaat uit, en de voltmeter wijst ongeveer de bronspanning aan.",
    mis: "Meters hebben geen invloed op de schakeling. Laat leerlingen de gevolgen van een verkeerd geplaatste meter voorspellen." },
  { id: "w3-17", w: 3, s: "begrip", t: "mc", par: "20.11",
    q: "Je zet per ongeluk een ampèremeter parallel over een brandend lampje. Wat gebeurt er?",
    o: ["Het lampje gaat uit en er loopt een grote stroom door de meter.", "Het lampje brandt normaal en de meter wijst de stroom door het lampje aan.", "Het lampje brandt feller."],
    why: "Een ampèremeter heeft een heel kleine weerstand. Parallel over het lampje is het een kortsluiting: bijna alle stroom gaat door de meter. Daardoor kan de zekering van de meter doorslaan." },
  { id: "w3-18", w: 3, s: "kennis", t: "mc", par: "20.14",
    q: "Waarop reageert een aardlekschakelaar?",
    o: ["Op een verschil tussen de stroom heen (fase) en de stroom terug (nul).", "Op een te grote stroom.", "Op een te hoge spanning.", "Op kortsluiting tussen fase en nul."],
    why: "Is de stroom terug kleiner dan de stroom heen, dan lekt er stroom weg, bijvoorbeeld via iemand naar de aarde. Al bij een verschil van 30 mA schakelt de aardlekschakelaar af. Een te grote stroom of kortsluiting is het werk van de zekering (installatieautomaat).",
    mis: "Een aardlekschakelaar reageert op een te grote stroom, net als een zekering." },
  { id: "w3-19", w: 3, s: "begrip", t: "mc", par: "20.14",
    q: "Waarom is de metalen behuizing van een wasmachine via randaarde verbonden met de aarde?",
    o: ["Komt de fase tegen de behuizing, dan loopt de stroom via de aardedraad weg en schakelt de beveiliging af, in plaats van via jou.",
        "Om statische lading van de draaiende trommel af te voeren.",
        "Om energie te besparen.",
        "Zodat de machine minder spanning krijgt."],
    why: "Bij een defect kan de behuizing onder spanning komen te staan. Door de aardedraad met zijn kleine weerstand loopt er dan direct een flinke stroom naar de aarde, en de aardlekschakelaar of zekering schakelt af." },
  { id: "w3-20", w: 3, s: "begrip", t: "mc", par: "20.7",
    q: "In huis staan alle stopcontacten en lampen parallel. Waarom niet in serie?",
    o: ["Zo krijgt elk apparaat de volle 230 V en werkt het los van de andere apparaten.", "Parallel levert minder stroom en is dus zuiniger.", "In serie zou de stroom te groot worden.", "Zo hoeft de meterkast maar één zekering te hebben."],
    why: "Elke parallelle tak staat op de volle netspanning. Zet je een apparaat uit, dan blijven de andere gewoon werken. In serie zouden alle apparaten samen de spanning delen en zou alles uitgaan als er één uit staat." },

  // ---------- Week 5: Stroom en magnetisme ----------
  { id: "w5-01", w: 5, s: "kennis", t: "mc", par: "21.9",
    q: "Welke metalen worden door een magneet aangetrokken?",
    o: ["IJzer, nikkel en kobalt (en legeringen daarvan): de ferromagnetische stoffen", "Alle metalen", "Alleen ijzer", "Alle metalen die stroom geleiden"],
    why: "Alleen ferromagnetische stoffen worden duidelijk aangetrokken. Koper, aluminium en de meeste munten niet.",
    mis: "Magneten trekken alle metalen aan. Laat leerlingen aluminium, koper en munten testen." },
  { id: "w5-02", w: 5, s: "begrip", t: "mc", par: "21.9",
    q: "Een magneet trekt een ongemagnetiseerde ijzeren spijker aan. Hoe komt dat?",
    o: ["De magneet maakt de spijker tijdelijk zelf magnetisch; de kant bij de magneet wordt een tegengestelde pool.",
        "De spijker is van zichzelf al een zwakke magneet.",
        "Een magneet trekt alle metalen aan.",
        "De magneet geeft elektrische lading aan de spijker."],
    why: "Dat heet magnetische influentie. In de spijker richten de magnetische domeinen zich naar het veld van de magneet. De kant bij een noordpool wordt een zuidpool, en tegengestelde polen trekken elkaar aan. Vergelijk het met elektrische influentie (§ 18.4).",
    elektra: "Hoe lijkt magnetische influentie op elektrische influentie, en waarin verschilt het?" },
  { id: "w5-03", w: 5, s: "begrip", t: "twee", par: "21.9",
    q: "Aan een magneet hangt een spijker van zacht ijzer, en aan die spijker hangt een tweede spijker. Je haalt de magneet weg. Blijft de tweede spijker aan de eerste hangen?",
    o: ["Nee (of nauwelijks)", "Ja"],
    r: ["In zacht ijzer richten de domeinen zich weer willekeurig zodra het veld van de magneet weg is.",
        "De magneet heeft de spijkers voorgoed omgezet in permanente magneten.",
        "De spijkers blijven aan elkaar zitten door elektrische lading."],
    why: "Zolang de magneet er is, is de eerste spijker zelf een magneet en trekt hij de tweede aan. Zacht ijzer verliest zijn magnetisme bijna helemaal als het externe veld weg is. Bij staal blijft er meer magnetisme achter: zo maak je een permanente magneet." },
  { id: "w5-04", w: 5, s: "kennis", t: "mc", par: "21.9",
    q: "Wat is een magnetisch domein?",
    o: ["Een klein gebied in een ferromagnetische stof waarin de atomen magnetisch dezelfde kant op wijzen.", "Het gebied rond een magneet waarin je een kracht voelt.", "De noord- of zuidpool van een magneet.", "Een stuk ijzer zonder magnetisme."],
    why: "In ongemagnetiseerd ijzer wijzen de domeinen alle kanten op en heffen ze elkaar op. In een magneet zijn ze grotendeels in dezelfde richting gericht." },
  { id: "w5-05", w: 5, s: "begrip", t: "mc", par: "21.9",
    q: "Je zaagt een staafmagneet middendoor. Wat krijg je?",
    o: ["Twee magneten, elk met een noord- en een zuidpool.", "Een losse noordpool en een losse zuidpool.", "Twee stukken die niet meer magnetisch zijn."],
    why: "De domeinen blijven gericht, dus elk stuk is weer een complete magneet. Losse magnetische polen (monopolen) zijn nooit gevonden.",
    mis: "Een doorgezaagde magneet geeft een losse noord- en zuidpool." },
  { id: "w5-06", w: 5, s: "begrip", t: "mc", par: "21.1",
    q: "Is de noordpool van een magneet positief geladen?",
    o: ["Nee; magnetische polen zijn geen elektrische ladingen.", "Ja: noord is +, zuid is −.", "Alleen bij een elektromagneet."],
    why: "Een magneet is elektrisch neutraal. Een stilstaande lading merkt niets van een magneet, en een magneetpool trekt een geladen voorwerp niet aan zoals een lading dat doet.",
    mis: "Polen zijn ladingen; noord = +." },
  { id: "w5-07", w: 5, s: "kennis", t: "mc", par: "21.1",
    q: "Welke richting hebben de magnetische veldlijnen buiten een staafmagneet?",
    o: ["Van de noordpool naar de zuidpool", "Van de zuidpool naar de noordpool", "Van het midden naar beide polen"],
    why: "Buiten de magneet lopen de veldlijnen van noord naar zuid, binnen de magneet van zuid naar noord: magnetische veldlijnen zijn gesloten lussen. Een kompasnaald wijst met zijn noordpool langs de veldlijnen." },
  { id: "w5-08", w: 5, s: "begrip", t: "mc", par: "21.7", fig: FIG_RONDDRAAD,
    q: "Door een lange rechte draad loopt een stroom het papier uit (bovenaanzicht). Hoe lopen de magnetische veldlijnen eromheen?",
    o: ["In cirkels, tegen de klok in", "In cirkels, met de klok mee", "Recht van de draad af", "Recht naar de draad toe"],
    why: "Rechterhandregel: duim langs de stroom (naar je toe), dan geven je gekromde vingers de richting van de veldlijnen: tegen de klok in. Kompasnaaldjes rond de draad laten die cirkels zien.",
    mis: "Het veld rond een stroomdraad wijst van de draad af, zoals het elektrische veld rond een lading." },
  { id: "w5-09", w: 5, s: "begrip", t: "twee", par: "21.5", fig: FIG_DRAADVELD,
    q: "Door een rechte draad loopt een stroom naar rechts in een homogeen magnetisch veld het papier in. Welke richting heeft de kracht op de draad?",
    o: ["Omhoog (in het vlak van het papier)", "Het papier in", "Naar rechts", "Omlaag"],
    r: ["De kracht staat loodrecht op de stroom én loodrecht op het veld.",
        "De kracht werkt langs de veldlijnen.",
        "De kracht werkt in de richting van de stroom."],
    why: "De lorentzkracht staat loodrecht op I en op B. Met de rechterhandregel (vingers langs B, duim langs I, de handpalm duwt) vind je: omhoog.",
    mis: "De magnetische kracht werkt langs de veldlijnen. Laat de richting voorspellen vóór je de demo met de draad in de hoefijzermagneet doet.",
    elektra: "Hoe bepaal ik met de rechterhand de richting van de lorentzkracht op een stroomdraad?" },
  { id: "w5-10", w: 5, s: "begrip", t: "mc", par: "21.5",
    q: "Een stroomvoerende draad ligt evenwijdig aan de veldlijnen van een homogeen magnetisch veld. Hoe groot is de lorentzkracht op de draad?",
    o: ["Nul", "Maximaal", "Half zo groot als wanneer de draad loodrecht op het veld staat"],
    why: "F = B·I·L·sin θ, met θ de hoek tussen stroom en veld. Evenwijdig betekent θ = 0, dus sin θ = 0 en F = 0." },
  { id: "w5-11", w: 5, s: "reken", t: "mc", par: "21.5",
    q: "Een draad van 0,30 m staat loodrecht op een magnetisch veld van 0,50 T. Er loopt 2,0 A door. Hoe groot is de kracht?",
    o: ["0,30 N", "3,0 N", "1,2 N", "0,030 N"],
    why: "F = B·I·L = 0,50 · 2,0 · 0,30 = 0,30 N." },
  { id: "w5-12", w: 5, s: "begrip", t: "mc", par: "21.7", fig: FIG_TWEEDRADEN,
    q: "Door twee evenwijdige draden loopt een stroom in dezelfde richting. Wat doen de draden?",
    o: ["Ze trekken elkaar aan.", "Ze stoten elkaar af.", "Ze oefenen geen kracht op elkaar uit."],
    why: "Elke draad staat in het magnetische veld van de andere. Met de rechterhandregels vind je: stromen in dezelfde richting trekken elkaar aan, tegengestelde stromen stoten elkaar af. Precies andersom dan bij ladingen!",
    mis: "Gelijk stoot af, net als bij ladingen en magneetpolen." },
  { id: "w5-13", w: 5, s: "reken", t: "mc", par: "21.7",
    q: "Op afstand r van een lange rechte stroomdraad is het magnetische veld B. Hoe groot is het veld op afstand 2r?",
    o: ["B/2", "B/4", "2B", "B"],
    why: "B = μ₀·I/(2π·r): het veld is omgekeerd evenredig met r, niet met r². Twee keer zo ver weg geeft de helft.",
    mis: "Het kwadraat uit de wet van Coulomb overnemen: dan zou het B/4 zijn." },
  { id: "w5-14", w: 5, s: "reken", t: "mc", par: "21.7",
    q: "Een lange spoel heeft N windingen. Je maakt een spoel van dezelfde lengte met 2N windingen en stuurt er dezelfde stroom door. Hoe groot is het veld in de spoel?",
    o: ["2 keer zo groot", "4 keer zo groot", "Even groot", "Half zo groot"],
    why: "B = μ₀·(N/L)·I: het veld is evenredig met het aantal windingen per meter. Twee keer zoveel windingen op dezelfde lengte geeft een twee keer zo sterk veld." },
  { id: "w5-15", w: 5, s: "kennis", t: "mc", par: "21.7",
    q: "Hoe heet de constante μ₀ = 4π · 10⁻⁷ T·m/A?",
    o: ["De magnetische veldconstante (permeabiliteit van het vacuüm)", "De elektrische veldconstante", "De constante van Coulomb", "De magnetische flux"],
    why: "μ₀ is de magnetische veldconstante, in het Engels permeability of free space. De elektrische tegenhanger is ε₀ (week 1)." },
  { id: "w5-16", w: 5, s: "kennis", t: "koppel", par: "21.5–21.7",
    q: "Koppel elke grootheid aan haar eenheid.",
    pairs: [["magnetische veldsterkte B", "tesla (T)"], ["magnetische veldconstante μ₀", "T·m/A"], ["krachtmoment τ", "newtonmeter (N·m)"], ["lorentzkracht F", "newton (N)"]],
    why: "1 T is het veld waarin een draad van 1 m met 1 A loodrecht op het veld een kracht van 1 N ondervindt: T = N/(A·m)." },
  { id: "w5-17", w: 5, s: "kennis", t: "mc", par: "21.7",
    q: "Hoe vind je met de rechterhand de richting van het magnetische veld rond een rechte stroomdraad?",
    o: ["Duim langs de stroom; de gekromde vingers geven de richting van de veldlijnen.", "Vingers langs de stroom; de duim geeft de richting van het veld.", "Duim langs het veld; de vingers geven de stroom.", "Wijsvinger langs de stroom, middelvinger langs het veld."],
    why: "Bij een rechte draad wijst de duim langs de stroom. Let op: bij een spoel is het andersom. Daar volgen de vingers de stroom door de windingen en wijst de duim naar de noordpool.",
    mis: "De rechterhandregels als trucje, met de verkeerde vinger of volgorde. Laat steeds benoemen wat elke vinger voorstelt." },
  { id: "w5-18", w: 5, s: "begrip", t: "mc", par: "21.6",
    q: "Wanneer is het krachtmoment op een stroomvoerende spoel in een homogeen magnetisch veld het grootst?",
    o: ["Als het vlak van de spoel evenwijdig aan de veldlijnen ligt", "Als het vlak van de spoel loodrecht op de veldlijnen staat", "Het krachtmoment is in elke stand even groot"],
    why: "τ = N·I·A·B·sin φ, met φ de hoek tussen de normaal op de spoel en het veld. Ligt het vlak evenwijdig aan B, dan is φ = 90°: maximaal krachtmoment. Staat het vlak loodrecht op B, dan is het krachtmoment nul." },
  { id: "w5-19", w: 5, s: "begrip", t: "mc", par: "21.6",
    q: "Waarvoor dient de commutator (stroomwisselaar) in een gelijkstroommotor?",
    o: ["Hij keert na elke halve draai de stroom in de spoel om, zodat het krachtmoment steeds dezelfde draairichting geeft.", "Hij verhoogt de spanning op de spoel.", "Hij remt de spoel af als die te snel draait.", "Hij zet gelijkstroom om in wisselstroom voor het net."],
    why: "Zonder commutator zou het krachtmoment na een halve draai omkeren en zou de spoel heen en weer schommelen. Door de stroom op het juiste moment om te keren, blijft de motor dezelfde kant op draaien." },
  { id: "w5-20", w: 5, s: "begrip", t: "mc", par: "21.5",
    q: "Een geladen deeltje beweegt loodrecht op een homogeen magnetisch veld. Waarom wordt het deeltje niet sneller?",
    o: ["De lorentzkracht staat steeds loodrecht op de snelheid; alleen de richting verandert.", "Het magnetische veld remt het deeltje juist af.", "Er werkt geen kracht op het deeltje.", "Het deeltje wordt wel sneller, maar heel langzaam."],
    why: "Een kracht loodrecht op de beweging verricht geen arbeid, net als bij een steen aan een touw. Het deeltje beschrijft een cirkelbaan met constante snelheid.",
    mis: "De lorentzkracht verricht arbeid en versnelt het deeltje." },

  // ---------- Week 6: Elektromagnetische inductie ----------
  { id: "w6-01", w: 6, s: "begrip", t: "twee", par: "22.1", fig: FIG_SPOEL,
    q: "Een sterke magneet ligt stil in een spoel die op een stroommeter is aangesloten. Loopt er een inductiestroom?",
    o: ["Nee", "Ja"],
    r: ["Alleen een veranderende magnetische flux door de spoel wekt een spanning op.",
        "Het veld van de magneet is sterk genoeg om een stroom op te wekken.",
        "De magneet geeft elektronen af aan de spoel."],
    why: "Inductie draait om verandering. Een stilliggende magneet geeft een constante flux, en dan is er geen inductiespanning, hoe sterk de magneet ook is. Beweeg je de magneet, dan wijst de meter wél uit.",
    mis: "Inductie ontstaat bij een sterk veld, niet bij een veranderend veld. Doe de proef als voorspellen–waarnemen–verklaren: magneet stil in de spoel tegenover bewegend.",
    elektra: "Waarom wekt een stilliggende magneet in een spoel geen stroom op?" },
  { id: "w6-02", w: 6, s: "begrip", t: "mc", par: "22.1",
    q: "Je beweegt een magneet bij een draadwinding met een spleet erin (de kring is open). Wat gebeurt er?",
    o: ["Er ontstaat een inductiespanning, maar er loopt geen stroom.", "Er gebeurt niets, want de kring is niet gesloten.", "Er ontstaat een spanning en er loopt ook een stroom."],
    why: "De fluxverandering induceert altijd een spanning, ook in een open winding: die meet je over de spleet. Voor een stroom is wel een gesloten kring nodig. Dat zie je bij de ring van Thomson met en zonder spleet.",
    mis: "Inductie vraagt een gesloten kring." },
  { id: "w6-03", w: 6, s: "kennis", t: "mc", par: "22.3",
    q: "Voor de magnetische flux geldt Φ = B·A·cos φ. Wat is φ?",
    o: ["De hoek tussen het veld en de normaal op het oppervlak", "De hoek tussen het veld en het oppervlak zelf", "De draaihoek van de magneet", "De fase van de wisselspanning"],
    why: "De normaal staat loodrecht op het oppervlak. Gaat het veld recht door het oppervlak, dan is φ = 0 en is de flux maximaal (B·A)." },
  { id: "w6-04", w: 6, s: "reken", t: "mc", par: "22.3",
    q: "Een winding met een oppervlakte van 0,020 m² staat loodrecht op een magnetisch veld van 0,50 T (het veld gaat recht door de winding). Hoe groot is de flux?",
    o: ["0,010 Wb", "0,10 Wb", "0,040 Wb", "25 Wb"],
    why: "Φ = B·A = 0,50 · 0,020 = 0,010 Wb. Wie deelt in plaats van vermenigvuldigt, krijgt 25 of 0,040." },
  { id: "w6-05", w: 6, s: "begrip", t: "mc", par: "22.3",
    q: "Je draait dezelfde winding zo dat het vlak van de winding evenwijdig aan de veldlijnen ligt. Hoe groot is de flux nu?",
    o: ["Nul", "Nog steeds 0,010 Wb", "Het dubbele"],
    why: "Er gaan nu geen veldlijnen door de winding: φ = 90°, cos φ = 0, dus Φ = 0. Het veld is even sterk gebleven; alleen de flux door de winding is veranderd.",
    mis: "Flux en veld zijn hetzelfde. Ook het oppervlak en de stand tellen mee." },
  { id: "w6-06", w: 6, s: "kennis", t: "koppel", par: "22.3–22.4",
    q: "Koppel elke grootheid aan haar eenheid.",
    pairs: [["magnetische flux Φ", "weber (Wb) = T·m²"], ["magnetische veldsterkte B", "tesla (T)"], ["fluxverandering per seconde ΔΦ/Δt", "Wb/s = V"], ["inductiespanning", "volt (V)"]],
    why: "Volgens de wet van Faraday is de inductiespanning gelijk aan (het aantal windingen keer) de fluxverandering per seconde. Daarom is 1 Wb/s gelijk aan 1 V." },
  { id: "w6-07", w: 6, s: "begrip", t: "mc", par: "22.4", fig: FIG_FLUX,
    q: "De grafiek toont de flux door een spoel als functie van de tijd. In welk interval is de inductiespanning het grootst?",
    o: ["III", "II", "I"],
    why: "De inductiespanning hangt af van hoe snel de flux verandert: de steilheid van de grafiek. In III daalt de flux het snelst. In II is de flux groot, maar constant: daar is de inductiespanning nul.",
    mis: "Een grote flux geeft een grote inductiespanning. Laat leerlingen een Φ(t)-grafiek omzetten in een U(t)-grafiek.",
    elektra: "Waarom hangt de inductiespanning af van de verandering van de flux, en niet van de flux zelf?" },
  { id: "w6-08", w: 6, s: "begrip", t: "mc", par: "22.4", fig: FIG_FLUX,
    q: "Hoe groot is de inductiespanning in interval II, waar de flux groot is?",
    o: ["Nul", "Groot, want de flux is groot", "Even groot als in interval I"],
    why: "In II verandert de flux niet, dus ΔΦ/Δt = 0 en er is geen inductiespanning, hoe groot de flux ook is." },
  { id: "w6-09", w: 6, s: "reken", t: "mc", par: "22.4",
    q: "Een spoel heeft 100 windingen. De flux per winding neemt in 0,50 s gelijkmatig af van 0,020 Wb tot nul. Hoe groot is de inductiespanning?",
    o: ["4,0 V", "0,040 V", "1,0 V", "2,0 V"],
    why: "U = N·ΔΦ/Δt = 100 · 0,020/0,50 = 4,0 V. Wie N vergeet, krijgt 0,040 V; wie met Δt vermenigvuldigt, krijgt 1,0 V." },
  { id: "w6-10", w: 6, s: "reken", t: "mc", par: "22.4",
    q: "Je laat dezelfde fluxverandering in de helft van de tijd plaatsvinden. Wat gebeurt er met de inductiespanning?",
    o: ["Die wordt 2 keer zo groot.", "Die wordt half zo groot.", "Die blijft gelijk.", "Die wordt 4 keer zo groot."],
    why: "U = N·ΔΦ/Δt: dezelfde ΔΦ in de helft van de tijd geeft een twee keer zo grote spanning (wel maar half zo lang)." },
  { id: "w6-11", w: 6, s: "begrip", t: "twee", par: "22.5",
    q: "Je trekt de noordpool van een magneet uit een spoel. Wordt de kant van de spoel bij de magneet dan een noordpool of een zuidpool?",
    o: ["Een zuidpool", "Een noordpool"],
    r: ["De spoel werkt de verandering tegen: ze probeert de weggaande magneet vast te houden en trekt de noordpool dus aan.",
        "Het geïnduceerde veld is altijd tegengesteld aan het veld van de magneet.",
        "Een spoel stoot een magneet altijd af."],
    why: "Wet van Lenz: de inductiestroom werkt de oorzaak tegen. Hier neemt de flux af, dus het geïnduceerde veld wijst juist mee met het veld van de magneet. De spoel trekt de magneet terug: de kant bij de noordpool wordt een zuidpool.",
    mis: "Het geïnduceerde veld is altijd tegengesteld aan het externe veld. Het is tegengesteld aan de verandering: bij afnemende flux is het juist mee gericht.",
    elektra: "Leg uit waarom het geïnduceerde veld bij afnemende flux met het externe veld mee wijst." },
  { id: "w6-12", w: 6, s: "begrip", t: "mc", par: "22.5",
    q: "Je duwt de noordpool van een magneet een spoel in. De spoel is aangesloten op een lampje. Welke kracht oefent de spoel op de magneet uit?",
    o: ["Een afstotende kracht", "Een aantrekkende kracht", "Geen kracht"],
    why: "De flux neemt toe, dus de inductiestroom maakt een veld dat die toename tegenwerkt: de kant bij de magneet wordt een noordpool en stoot de magneet af. Je moet dus arbeid verrichten; die energie komt in het lampje terecht." },
  { id: "w6-13", w: 6, s: "begrip", t: "mc", par: "22.5",
    q: "Waarom is een fietsdynamo zwaarder rond te draaien als het lampje brandt dan als het lampje los zit?",
    o: ["De inductiestroom werkt volgens Lenz de beweging tegen; jij levert de energie voor het licht.", "Het lampje maakt de dynamo warm en daardoor stroever.", "De magneet wordt zwakker als het lampje brandt."],
    why: "De wet van Lenz is energiebehoud. Loopt er stroom, dan werkt een tegenkracht op de draaiende magneet of spoel. De arbeid die je daartegen verricht, wordt de elektrische energie van het lampje. Zonder stroom (los lampje) is er geen tegenkracht.",
    mis: "Inductie levert energie 'uit het niets'." },
  { id: "w6-14", w: 6, s: "begrip", t: "mc", par: "22.5",
    q: "Een sterke magneet valt veel langzamer door een koperen buis dan door een plastic buis. Hoe komt dat?",
    o: ["In het koper ontstaan wervelstromen die volgens Lenz de val tegenwerken.", "Koper is magnetisch en trekt de magneet aan.", "In de koperen buis is meer luchtweerstand.", "De magneet wordt in het koper elektrisch geladen."],
    why: "Koper is niet ferromagnetisch. Maar de vallende magneet verandert de flux door elk ringetje van de buis, zodat er wervelstromen ontstaan. Hun veld werkt de beweging tegen. In plastic kan geen stroom lopen.",
    mis: "Het koper wordt magnetisch." },
  { id: "w6-15", w: 6, s: "begrip", t: "mc", par: "22.2", fig: FIG_RAILS,
    q: "Een metalen staaf glijdt naar rechts over twee rails in een magnetisch veld het papier in. Links zit een lampje. In welke richting loopt de inductiestroom door de staaf?",
    o: ["Omhoog (in de tekening)", "Omlaag (in de tekening)", "Er loopt geen stroom."],
    why: "De vrije ladingen in de staaf bewegen mee naar rechts en ondervinden een lorentzkracht. Voor positieve lading (stroomrichting) geeft de rechterhandregel: omhoog. Controle met Lenz: het oppervlak van de kring wordt groter, dus de flux het papier in neemt toe. De inductiestroom moet een veld het papier uit maken: tegen de klok in, dus in de staaf omhoog." },
  { id: "w6-16", w: 6, s: "reken", t: "mc", par: "22.2",
    q: "Een staaf van 0,20 m beweegt met 3,0 m/s loodrecht door een magnetisch veld van 0,50 T. Hoe groot is de inductiespanning over de staaf?",
    o: ["0,30 V", "3,0 V", "0,030 V", "7,5 V"],
    why: "U = B·L·v = 0,50 · 0,20 · 3,0 = 0,30 V." },
  { id: "w6-17", w: 6, s: "kennis", t: "koppel", par: "22.1–22.5",
    q: "Koppel elk Nederlands begrip aan de term in het boek.",
    pairs: [["inductiespanning", "induced emf"], ["bewegingsinductie", "motional emf"], ["wervelstroom", "eddy current"], ["wet van Lenz", "Lenz's law"]],
    why: "Let op: het boek gebruikt 'induction' in H18 ook voor wat wij influentie noemen. In H22 betekent het inductie." },

  // ---------- Week 7: Toepassingen en transformatoren ----------
  { id: "w7-01", w: 7, s: "reken", t: "mc", par: "22.9", fig: FIG_TRAFO,
    q: "De primaire spoel heeft 460 windingen en staat op 230 V. De secundaire spoel heeft 24 windingen. Hoe groot is de secundaire spanning?",
    o: ["12 V", "4400 V", "230 V", "24 V"],
    why: "Uₛ/Uₚ = Nₛ/Nₚ, dus Uₛ = 230 · 24/460 = 12 V. Wie de verhouding omdraait, komt op 4400 V." },
  { id: "w7-02", w: 7, s: "kennis", t: "mc", par: "22.9",
    q: "Welke formule geldt voor een ideale transformator?",
    o: ["Uₛ/Uₚ = Nₛ/Nₚ", "Uₛ/Uₚ = Nₚ/Nₛ", "Uₛ · Uₚ = Nₛ · Nₚ", "Iₛ/Iₚ = Nₛ/Nₚ"],
    why: "De spanning per winding is in beide spoelen gelijk, omdat dezelfde fluxverandering door alle windingen gaat. Voor de stromen geldt juist het omgekeerde: Iₛ/Iₚ = Nₚ/Nₛ." },
  { id: "w7-03", w: 7, s: "begrip", t: "twee", par: "22.9", fig: FIG_TRAFO_DC,
    q: "Je zet een gelijkspanning op de primaire spoel van een transformator. Wat wijst de voltmeter op de secundaire spoel aan, als de schakelaar al een tijdje gesloten is?",
    o: ["0 V", "Een constante spanning volgens de windingsverhouding", "Dezelfde spanning als op de primaire spoel"],
    r: ["Alleen een veranderende stroom geeft een veranderende flux in de kern.",
        "De kern geeft de spanning door zolang er stroom loopt.",
        "Elektronen stromen via de kern naar de secundaire spoel."],
    why: "Een constante stroom geeft een constante flux, en dan is er geen inductie. Alleen bij het in- en uitschakelen verandert de flux even: dan zie je een korte piek. Daarom werkt een transformator alleen op wisselspanning.",
    mis: "Een transformator werkt ook op gelijkspanning.",
    elektra: "Waarom werkt een transformator niet op gelijkspanning?" },
  { id: "w7-04", w: 7, s: "begrip", t: "mc", par: "22.9",
    q: "Gaan er elektronen van de primaire naar de secundaire spoel van een transformator?",
    o: ["Nee; de spoelen zijn niet geleidend verbonden. De koppeling gaat via de magnetische flux in de kern.", "Ja, via de ijzeren kern.", "Ja, door de lucht tussen de spoelen."],
    why: "De twee spoelen zijn elektrisch van elkaar gescheiden (galvanische scheiding). Dat is ook een veiligheidsvoordeel: een apparaat achter een scheidingstransformator heeft geen directe verbinding met het net.",
    mis: "Elektronen of 'stroom' gaan van de primaire naar de secundaire spoel." },
  { id: "w7-05", w: 7, s: "begrip", t: "mc", par: "22.9",
    q: "Waarom heeft een transformator een (gesloten) ijzeren kern?",
    o: ["De kern bundelt de magnetische veldlijnen, zodat bijna alle flux van de primaire spoel ook door de secundaire spoel gaat.", "Door de kern stroomt het magnetische veld als een vloeistof naar de andere spoel.", "De kern geleidt de stroom van de ene naar de andere spoel.", "De kern maakt de transformator stevig."],
    why: "IJzer is ferromagnetisch en maakt het veld veel sterker en geconcentreerd in de kern. Er 'stroomt' niets: de veldlijnen lopen door de kern. Met een open kern gaat een deel van de flux langs de secundaire spoel.",
    mis: "Het magnetische veld stroomt als een vloeistof door de kern." },
  { id: "w7-06", w: 7, s: "begrip", t: "twee", par: "22.9",
    q: "Een ideale transformator zet 230 V om in 23 V. Hoe verhoudt de secundaire stroom zich tot de primaire stroom?",
    o: ["10 keer zo groot", "10 keer zo klein", "Even groot"],
    r: ["Het vermogen blijft gelijk (Pₚ = Pₛ), dus bij een 10 keer zo kleine spanning hoort een 10 keer zo grote stroom.",
        "De stroom verandert in dezelfde verhouding als de spanning.",
        "Een transformator verandert alleen de spanning, niet de stroom."],
    why: "Een ideale transformator levert evenveel vermogen als hij opneemt: Uₚ·Iₚ = Uₛ·Iₛ. Spanning omlaag betekent stroom omhoog.",
    mis: "Een hogere secundaire spanning levert gratis meer energie op." },
  { id: "w7-07", w: 7, s: "reken", t: "mc", par: "22.9",
    q: "Een ideale transformator neemt primair 0,10 A op bij 230 V. De secundaire spanning is 12 V. Hoe groot is de secundaire stroom?",
    o: ["1,9 A", "0,0052 A", "0,10 A", "2,8 A"],
    why: "P = 230 · 0,10 = 23 W. Secundair: I = P/U = 23/12 ≈ 1,9 A." },
  { id: "w7-08", w: 7, s: "begrip", t: "mc", par: "22.9",
    q: "Je sluit op de secundaire spoel een apparaat aan dat meer vermogen gebruikt. Wat gebeurt er met de primaire stroom?",
    o: ["Die wordt groter.", "Die blijft gelijk; de primaire stroom ligt vast.", "Die wordt kleiner."],
    why: "De transformator neemt primair evenveel vermogen op als het apparaat secundair gebruikt. Meer vermogen secundair betekent dus meer stroom primair. Een onbelaste transformator neemt (bijna) geen stroom op.",
    mis: "De primaire stroom staat vast, los van wat er secundair is aangesloten." },
  { id: "w7-09", w: 7, s: "begrip", t: "mc", par: "22.9",
    q: "Waarom wordt elektrische energie over grote afstanden met hoogspanning getransporteerd?",
    o: ["Bij een hoge spanning is de stroom klein, zodat het warmteverlies I²R in de kabels klein is.", "Hoogspanning gaat sneller door de kabel.", "Bij hoogspanning hebben de kabels geen weerstand.", "Zo zijn er minder elektronen nodig."],
    why: "Voor hetzelfde vermogen geeft een 10 keer zo hoge spanning een 10 keer zo kleine stroom en dus 100 keer minder verlies in de kabels. Transformatoren maken het omzetten mogelijk." },
  { id: "w7-10", w: 7, s: "reken", t: "mc", par: "22.9",
    q: "Een transformator moet 230 V omzetten in 11,5 V. De primaire spoel heeft 1000 windingen. Hoeveel windingen heeft de secundaire spoel?",
    o: ["50", "20 000", "20", "500"],
    why: "Nₛ = Nₚ · Uₛ/Uₚ = 1000 · 11,5/230 = 50. De verhouding is 1 : 20." },
  { id: "w7-11", w: 7, s: "begrip", t: "mc", par: "22.7", fig: FIG_GENERATOR,
    q: "De grafiek toont de spanning van een generator. Hoe staat het vlak van de draaiende spoel ten opzichte van de veldlijnen op moment P (een top)?",
    o: ["Evenwijdig aan de veldlijnen: de flux is dan nul, maar verandert het snelst.", "Loodrecht op de veldlijnen: de flux is dan maximaal.", "Onder een hoek van 45°."],
    why: "De inductiespanning hangt af van hoe snel de flux verandert. Die verandering is het grootst als de spoel 'door nul' gaat: het vlak evenwijdig aan B. Bij Q (spanning nul) staat het vlak loodrecht op B: de flux is dan maximaal en verandert even niet.",
    mis: "Een grote flux geeft een grote spanning." },
  { id: "w7-12", w: 7, s: "reken", t: "mc", par: "22.7", fig: FIG_GENERATOR,
    q: "Eén periode van de generatorspanning duurt 20 ms (zie de grafiek). Wat is de frequentie?",
    o: ["50 Hz", "20 Hz", "0,02 Hz", "100 Hz"],
    why: "f = 1/T = 1/0,020 s = 50 Hz: de frequentie van ons lichtnet." },
  { id: "w7-13", w: 7, s: "begrip", t: "mc", par: "22.7",
    q: "Je laat een generator twee keer zo snel draaien. Wat gebeurt er met de piekspanning?",
    o: ["Die wordt 2 keer zo groot (en de frequentie ook).", "Die blijft gelijk; alleen de frequentie verdubbelt.", "Die wordt 4 keer zo groot."],
    why: "Umax = N·B·A·ω: de flux verandert twee keer zo snel, dus de piekspanning verdubbelt. Tegelijk verdubbelt de frequentie." },
  { id: "w7-14", w: 7, s: "begrip", t: "mc", par: "22.7",
    q: "Wat is het verschil tussen een elektromotor en een generator (dynamo)?",
    o: ["Ze zijn vergelijkbaar gebouwd; alleen de energieomzetting is omgekeerd.", "Een generator heeft geen magneet.", "Een elektromotor werkt alleen op wisselstroom.", "Een generator heeft geen spoel."],
    why: "Beide hebben een spoel die in een magnetisch veld draait. Een motor zet elektrische energie om in bewegingsenergie (lorentzkracht), een generator doet het omgekeerde (inductie). Twee gekoppelde motortjes laten dat mooi zien.",
    mis: "Motor en dynamo zijn totaal verschillende apparaten." },
  { id: "w7-15", w: 7, s: "begrip", t: "mc", par: "22.6",
    q: "Hoe maakt een luidspreker geluid?",
    o: ["Een wisselstroom door de spoel in het veld van een magneet geeft een wisselende kracht; de spoel en de conus gaan trillen.", "Het geluid zit in de stroom en komt uit de draad.", "De magneet trilt doordat er spanning op staat.", "De stroom verwarmt de lucht in de conus, die daardoor uitzet."],
    why: "Op de spoel werkt een lorentzkracht die met de stroom mee wisselt. De conus trilt mee en duwt de lucht heen en weer: geluid. Het geluid zit niet in de stroom; de stroom heeft dezelfde vorm als de geluidsgolf.",
    mis: "Het geluid zit in de stroom." },
  { id: "w7-16", w: 7, s: "begrip", t: "mc", par: "22.6",
    q: "Een dynamische microfoon is gebouwd als een kleine luidspreker. Hoe werkt hij?",
    o: ["Geluid laat een spoel in een magnetisch veld trillen; daardoor wordt een wisselspanning geïnduceerd.", "Geluid laadt de spoel elektrisch op.", "Geluid verandert de weerstand van de magneet.", "De microfoon heeft een batterij die het geluid omzet."],
    why: "Het is de luidspreker omgekeerd: beweging wordt elektrische energie (inductie), net als bij de generator." },
  { id: "w7-17", w: 7, s: "kennis", t: "koppel", par: "22.6–22.9",
    q: "Koppel elk apparaat aan wat het doet.",
    pairs: [["transformator", "zet een wisselspanning om in een hogere of lagere"], ["generator", "zet bewegingsenergie om in elektrische energie"], ["elektromotor", "zet elektrische energie om in bewegingsenergie"], ["luidspreker", "zet een elektrisch signaal om in geluid"]],
    why: "Motor en luidspreker werken met de lorentzkracht, generator en microfoon met inductie. De transformator gebruikt inductie om spanning om te zetten." }
];

/* OPSLAG (alleen op dit apparaat)                                      */
/* ================================================================== */
const LS = "oya-elektriciteit-v1";
const INTERVAL = [0, 1, 2, 4, 8, 16];
const AANTAL = [3, 5, 10], MINUTEN = [3, 5];
const DOELEN = [{ n: 3, t: "3× per week" }, { n: 5, t: "5× per week" }, { n: 7, t: "Elke dag" }];
function weekdoel() { const d = S.inst.doel; return DOELEN.some(x => x.n === d) ? d : 3; }
function vandaag(d) { d = d || new Date(); return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); }
function plusDagen(dag, n) { const [y,m,d] = dag.split("-").map(Number); return vandaag(new Date(y, m-1, d+n)); }
function leeg() { return { v: 1, inst: { modus: "aantal", aantal: 5, min: 3 }, q: {}, dagen: {}, sessies: [] }; }
let S = leeg();
try { const x = JSON.parse(localStorage.getItem(LS)); if (x && x.v === 1) S = Object.assign(leeg(), x); } catch (e) {}
let opslagOk = true;
function bewaar() { try { localStorage.setItem(LS, JSON.stringify(S)); opslagOk = true; } catch (e) { opslagOk = false; } }

/* AFGELEIDE GETALLEN                                                   */
/* ================================================================== */
function weekStats(n) {
  const qs = Q.filter(q => q.w === n); let gezien = 0, box = 0, aangeraakt = 0;
  qs.forEach(q => { const r = S.q[q.id]; if (r) { gezien += r.gezien; box += r.box; aangeraakt++; } });
  return { totaal: qs.length, gezien, aangeraakt, beheersing: qs.length ? box / (qs.length * (INTERVAL.length - 1)) : 0 };
}
function niveau(st) {
  if (!st.aangeraakt) return "nog niet begonnen";
  if (st.beheersing < 0.35) return "bezig";
  if (st.beheersing < 0.7) return "goed op weg";
  return "beheerst";
}
function dagenDezeWeek() {
  const nu = new Date(); const wd = (nu.getDay() + 6) % 7; // maandag = 0
  let n = 0; for (let i = 0; i <= wd; i++) { if (S.dagen[plusDagen(vandaag(), -i)]) n++; } return n;
}

/* SESSIES                                                              */

function schud(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i+1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function rangschik(pool) {
  const t = vandaag();
  return pool.map(q => { const r = S.q[q.id]; const laag = !r ? 2 : (r.due <= t ? 3 : 1); return { q, k: laag * 10 + Math.random() * 3 }; })
    .sort((a, b) => b.k - a.k).map(x => x.q);
}
/* Tot en met: helft uit de gekozen week, helft uit eerdere weken (om en om), zodat het nieuwe onderwerp niet wegvalt
   achter herhaling en eerdere onderwerpen wel door elkaar terugkomen (interleaving). */
function heeftEerder(week) { return Q.some(q => q.w < week); }
function wachtrijTm(week) {
  const a = rangschik(Q.filter(q => q.w === week)), b = rangschik(Q.filter(q => q.w < week)); const uit = [];
  while (a.length || b.length) { if (a.length) uit.push(a.shift()); if (b.length) uit.push(b.shift()); }
  return uit;
}
function wachtrij(week) {
  const t = vandaag();
  const pool = week ? Q.filter(q => q.w === week) : Q;
  return pool.map(q => { const r = S.q[q.id]; const laag = !r ? 2 : (r.due <= t ? 3 : 1); return { q, k: laag * 10 + Math.random() * 3 }; })
    .sort((a, b) => b.k - a.k).map(x => x.q);
}
function scoor(q, goed) {
  const t = vandaag();
  const r = S.q[q.id] || { box: 0, gezien: 0, goed: 0, fout: 0, due: t };
  r.gezien++; if (goed) { r.goed++; r.box = Math.min(r.box + 1, INTERVAL.length - 1); } else { r.fout++; r.box = 0; }
  r.due = plusDagen(t, INTERVAL[r.box]); S.q[q.id] = r; bewaar();
}

const app = document.getElementById("app");

function start(week, extra, tm) {

  sessie = { week, tm, extra, rij: i.modus === "aantal" ? rij.slice(0, i.aantal + extra) : rij, i: 0, beantwoord: 0, goed: 0, mis: [],

}
function pct() { if (sessie.modus === "aantal") return 100 * sessie.i / sessie.rij.length;

function optiesHtml(order, cls) { return `<div class="opties">${order.map((o, k) => `<button class="opt ${cls||""}" data-k="${k}"><span class="lt">${LT[k]}</span><span>${esc(o.t)}</span></button>`).join("")}</div>`; }

  <div class="vkaart">${vraagKop(q)}
    ${it.o2 ? `<div class="kolommen"><div><div class="small muted">Antwoord</div>${lijst(it.o1, LT, 1)}</div><div><div class="small muted">Reden</div>${lijst(it.o2, "123456", 2)}</div></div>` : lijst(it.o1, LT, 1)}
  </div>
  ${klas.stap === 1 ? `<div class="herstem">Bespreek je keuze met je buur, en stem dan opnieuw.</div>` : ""}
  ${toon ? `<div class="terug"><h3>Uitleg</h3><div>${esc(q.why)}</div>${q.mis ? `<div class="noot"><b>Leerlingdenkbeeld.</b> ${esc(q.mis)}</div>` : ""}${q.par ? `<div class="boek">Cutnell &amp; Johnson § ${esc(q.par)}</div>` : ""}</div>` : ""}
  <div class="klasbalk"><button class="btn btn-stil" id="vorige" ${klas.i === 0 && klas.stap === 0 ? "disabled" : ""}>‹ Vorige</button>
    ${klas.stap === 0 ? `<button class="btn btn-stil" id="herstem">Bespreek en stem opnieuw</button>` : ""}
    ${klas.stap < 2 ? `<button class="btn btn-primair" id="toon">Toon antwoord en uitleg</button>` : `<button class="btn btn-primair" id="volgende" ${klas.i + 1 >= klas.rij.length ? "disabled" : ""}>Volgende vraag ›</button>`}</div>`;
  document.getElementById("sluit").onclick = () => { view = "thuis"; teken(); };
  const h = document.getElementById("herstem"); if (h) h.onclick = () => { klas.stap = 1; teken(); };
  const t = document.getElementById("toon"); if (t) t.onclick = () => { klas.stap = 2; teken(); };
  const v = document.getElementById("volgende"); if (v) v.onclick = () => klasStap(1);
  document.getElementById("vorige").onclick = () => klasStap(-1);
  app.querySelectorAll("button.opt[data-trap]").forEach(b => b.onclick = () => {
    const key = "k" + b.dataset.trap, k = Number(b.dataset.k);
    it[key] = it[key] === k ? null : k; teken();
  });
}
function klasStap(d) {
  if (d > 0) { if (klas.stap < 2) klas.stap++; else if (klas.i + 1 < klas.rij.length) { klas.i++; klas.stap = 0; } }
  else { if (klas.stap > 0) klas.stap--; else if (klas.i > 0) { klas.i--; klas.stap = 2; } }
  teken();
}
document.addEventListener("keydown", e => {
  if (view !== "klas") return;
  if (["ArrowRight", "PageDown", " "].includes(e.key)) { e.preventDefault(); klasStap(1); }
  if (["ArrowLeft", "PageUp"].includes(e.key)) { e.preventDefault(); klasStap(-1); }
});

function teken() {
  if (view !== "klas") document.body.classList.remove("klas");
  if (view === "thuis") thuis(); else if (view === "inst") instellingen(); else if (view === "sessie") sessieView();
  else if (view === "eind") eindView(); else if (view === "klaskies") klasKies(); else if (view === "klas") klasView();
  window.scrollTo(0, 0);
}
/* Directe link naar een week: ...#week=1 start meteen een sessie; #tot=3 oefent week 1 t/m 3; #klas opent de klasmodus. */
(function () {
  const t = location.hash.match(/tot=(\d+)/);
  if (t && Q.some(q => q.w === Number(t[1]))) { start(Number(t[1]), 0, true); return; }
  const m = location.hash.match(/week=(\d+)/);
  if (m && Q.some(q => q.w === Number(m[1]))) { start(Number(m[1]), 0); return; }
  if (location.hash === "#klas") view = "klaskies";
  teken();
})();
</script>
</body>
</html>
